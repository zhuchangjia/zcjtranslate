<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><title>指译设置</title></head>
<body class="options"><main><h1>指译设置 <small>完全离线</small></h1><p>单词使用内置英中/日中词库；选中一段文字时按词拆分、翻译并按原顺序组合。</p>
<label><span>源语言</span><select id="sourceLanguage"><option value="auto">自动识别英语/日语</option><option value="en">英语</option><option value="ja">日语</option></select></label>
<label><span>目标语言</span><select id="targetLanguage"><option value="auto">跟随系统/浏览器</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁体中文</option></select></label>
<p class="hint">无需下载语言包，也不会访问网络。逐词结果不具备机器翻译的语序调整能力。发音直接调用浏览器扩展 TTS 和 Windows 已安装语音。</p>
<div class="actions"><button id="save">保存设置</button><span id="saved"></span></div>
</main><script src="options.js"></script></body></html>
